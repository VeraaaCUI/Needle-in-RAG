[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-char-trace"
version = "0.1.0"
description = "RAG poisoning reproduction + retrieval trace scaffolding (character-level extensions planned)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Your Name"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
